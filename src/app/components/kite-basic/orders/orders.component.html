<div class="orders-container">
  <mat-card class="orders-card">
    <mat-card-title>Orders</mat-card-title>
    <mat-card-content>
      <table mat-table [dataSource]="orders" class="mat-elevation-z8 full-width-table">

        <ng-container matColumnDef="order_id">
          <th mat-header-cell *matHeaderCellDef> Order ID </th>
          <td mat-cell *matCellDef="let order"> {{ order.order_id || '-' }} </td>
        </ng-container>

        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef> Status </th>
          <td mat-cell *matCellDef="let order"> {{ order.status }} </td>
        </ng-container>

        <ng-container matColumnDef="product">
          <th mat-header-cell *matHeaderCellDef> Product </th>
          <td mat-cell *matCellDef="let order"> {{ order.product }} </td>
        </ng-container>

        <ng-container matColumnDef="tradingsymbol">
          <th mat-header-cell *matHeaderCellDef> Symbol </th>
          <td mat-cell *matCellDef="let order"> {{ order.tradingsymbol || '-' }} </td>
        </ng-container>

        <ng-container matColumnDef="transaction_type">
          <th mat-header-cell *matHeaderCellDef> Type </th>
          <td mat-cell *matCellDef="let order"> {{ order.transaction_type }} </td>
        </ng-container>

        <ng-container matColumnDef="quantity">
          <th mat-header-cell *matHeaderCellDef> Quantity </th>
          <td mat-cell *matCellDef="let order"> {{ order.quantity }} </td>
        </ng-container>

        <ng-container matColumnDef="average_price">
          <th mat-header-cell *matHeaderCellDef> Avg Price </th>
          <td mat-cell *matCellDef="let order"> {{ order.average_price }} </td>
        </ng-container>

        <!-- Delete Button Column -->
        <ng-container matColumnDef="delete">
          <th mat-header-cell *matHeaderCellDef> Actions </th>
          <td mat-cell *matCellDef="let order">
            <button 
              mat-button 
              [color]="(order.status === 'TRIGGER PENDING' || order.status === 'OPEN') ? 'warn' : 'default'"
              [disabled]="order.status === 'COMPLETE' || order.status === 'CANCELLED'"
              (click)="confirmDelete(order.order_id)">
              Delete
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

      </table>
    </mat-card-content>
  </mat-card>
</div>
