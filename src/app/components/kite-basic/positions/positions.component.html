<div class="container">
  <mat-card class="orders-card">
    <mat-card-title>Positions</mat-card-title>
    <mat-card-content>
      
      <table mat-table [dataSource]="positions" class="mat-elevation-z8">
        <!-- Trading Symbol -->
        <ng-container matColumnDef="tradingsymbol">
          <th mat-header-cell *matHeaderCellDef> Trading Symbol </th>
          <td mat-cell *matCellDef="let element"> {{ element.tradingsymbol }} </td>
        </ng-container>
  
        <!-- Exchange -->
        <ng-container matColumnDef="exchange">
          <th mat-header-cell *matHeaderCellDef> Exchange </th>
          <td mat-cell *matCellDef="let element"> {{ element.exchange }} </td>
        </ng-container>

        <!-- Product -->
        <ng-container matColumnDef="product">
          <th mat-header-cell *matHeaderCellDef> Product </th>
          <td mat-cell *matCellDef="let element"> {{ element.product }} </td>
        </ng-container>
  
        <!-- Quantity -->
        <ng-container matColumnDef="quantity">
          <th mat-header-cell *matHeaderCellDef> Quantity </th>
          <td mat-cell *matCellDef="let element"> {{ element.quantity }} </td>
        </ng-container>
  
        <!-- PnL -->
        <ng-container matColumnDef="pnl">
          <th mat-header-cell *matHeaderCellDef> PnL </th>
          <td mat-cell *matCellDef="let element" [ngClass]="{ 'positive': element.pnl > 0, 'negative': element.pnl < 0 }">
            {{ element.pnl | number: '1.2-2' }}
          </td>
        </ng-container>

        <!-- Exit Position Button -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef> Actions </th>
          <td mat-cell *matCellDef="let element">
            <button
              mat-icon-button
              [ngClass]="{ 'exit-btn': element.quantity !== 0, 'disabled-btn': element.quantity === 0 }"
              [disabled]="element.quantity === 0"
              (click)="exitPosition(element.tradingsymbol, element.quantity)"
            >
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>
  
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </mat-card-content>
  </mat-card>
</div>
